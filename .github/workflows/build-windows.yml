# 在 GitHub 的 Windows 電腦上把程式打包成 .exe
#
# - 推到 main：版本號自動變成 1.0.<第幾次打包>，並發佈到 Releases。
#   已經安裝的 Glass Widgets 會從 Releases 自動下載新版、關掉程式時自動更新。
# - 推到其他分支：只打包，在 Actions 頁面這次執行的「Artifacts」可以下載測試，不會發佈。
name: Build Windows app

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Set version
        id: version
        shell: bash
        run: |
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          echo "value=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # 先全部打包好（不在這一步上傳，避免兩個檔案同時建立 Release 撞在一起）
      - name: Build installer and portable exe
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Upload for download
        uses: actions/upload-artifact@v4
        with:
          name: Glass-Widgets-Windows
          path: dist/*.exe
          if-no-files-found: error

      # 只有 main 才發佈；latest.yml 和 .blockmap 是自動更新要用的
      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Glass Widgets ${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/Glass-Widgets-Setup-*.exe
            dist/Glass-Widgets-Setup-*.exe.blockmap
            dist/Glass-Widgets-Portable-*.exe
            dist/latest.yml
