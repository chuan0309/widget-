# 在 GitHub 的 Windows 電腦上把程式打包成 .exe
#
# - 推到 main：版本號自動變成 1.0.<第幾次打包>，並發佈到 Releases。
#   已經安裝的 Glass Widgets 會從 Releases 自動下載新版、關掉程式時自動更新。
# - 推到其他分支：只打包，在 Actions 頁面這次執行的「Artifacts」可以下載測試，不會發佈。
name: Build Windows app

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Matter：開一台模擬的 Matter 冷氣＋電扇，用 matter-home.js 配對、控制，確認真的有變
      - name: Matter selftest
        timeout-minutes: 4
        run: node tests/matter-selftest.js

      # 先檢查 PowerShell 腳本：語法對不對、裡面的 C# 能不能編譯、背景小幫手跑得起來
      - name: Check PowerShell scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in Get-ChildItem *.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { Write-Error "$($f.Name): $_" } }
            Write-Host "parsed $($f.Name)"
          }
          $src = Get-Content helper.ps1 -Raw
          foreach ($m in [regex]::Matches($src, "(?s)Add-Type -TypeDefinition @'\r?\n(.*?)\r?\n'@")) {
            Add-Type -TypeDefinition $m.Groups[1].Value
            Write-Host "compiled C# block"
          }
          # 跑 8 秒，至少要回報一次裝置清單（雲端電腦可能沒有音效卡，所以藍牙或音訊其中一個就好）
          $out = cmd /c "powershell -NoProfile -Command Start-Sleep 8 | powershell -NoProfile -ExecutionPolicy Bypass -File helper.ps1 2>&1"
          Write-Host ($out -join "`n")
          if (-not ($out | Where-Object { $_ -match '^(audio|bt) ' })) { throw 'helper.ps1 did not report anything' }

      - name: Set version
        id: version
        shell: bash
        # 版本號：1.03、1.04、1.05…（看已發佈的最後一版 +1；分支上的建置只是測試，不會發佈）
        # 自動更新規定要 x.y.z 格式，所以程式裡記成 1.3.0、1.4.0…，畫面上顯示成 1.03、1.04
        run: |
          git fetch --tags --quiet origin
          last=$(git tag -l 'v1.*.0' | sed -nE 's/^v1\.([0-9]+)\.0$/\1/p' | { grep -v '^0$' || true; } | sort -n | tail -1)
          n=$(( ${last:-2} + 1 ))
          npm version "1.$n.0" --no-git-tag-version --allow-same-version
          echo "value=1.$n.0" >> "$GITHUB_OUTPUT"
          echo "label=$(printf '1.%02d' "$n")" >> "$GITHUB_OUTPUT"

      # 「使用 Google／Pinterest 帳號登入」用的程式 ID，從 GitHub 的加密設定（Secrets）拿，
      # 只會放進打包好的程式裡，不會出現在原始碼。沒設定的話就是空的，程式會改用手動方式。
      - name: Write sign-in config
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
        run: |
          node -e "
            const e = process.env;
            require('fs').writeFileSync('oauth.json', JSON.stringify({
              google: { clientId: (e.GOOGLE_CLIENT_ID || '').trim(), clientSecret: (e.GOOGLE_CLIENT_SECRET || '').trim() },
              pinterest: { appId: (e.PINTEREST_APP_ID || '').trim(), appSecret: (e.PINTEREST_APP_SECRET || '').trim() },
            }));
            console.log('Google sign-in:', e.GOOGLE_CLIENT_ID ? 'yes' : 'no', '/ Pinterest sign-in:', e.PINTEREST_APP_ID ? 'yes' : 'no');
          "

      # 先全部打包好（不在這一步上傳，避免兩個檔案同時建立 Release 撞在一起）
      - name: Build installer and portable exe
        run: npx electron-builder --win nsis portable --x64 --publish never

      # 真的打開打包好的程式 15 秒，確認桌面上有畫出小組件（沒有的話不發佈）
      - name: Smoke test the packaged app
        shell: powershell
        run: |
          $log = Join-Path $env:APPDATA 'Glass Widgets\debug.log'
          $p = Start-Process -FilePath 'dist\win-unpacked\Glass Widgets.exe' -PassThru
          # 等到小組件畫面回報（最多 45 秒）；雲端電腦有時很慢，固定只等 15 秒會在回報前就被關掉
          $deadline = (Get-Date).AddSeconds(45)
          do {
            Start-Sleep 2
            $done = (Test-Path $log) -and ((Get-Content $log -Raw) -match 'host page')
          } until ($done -or (Get-Date) -gt $deadline)
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process 'Glass Widgets' -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path $log)) { throw 'debug.log was not written' }
          $text = Get-Content $log -Raw
          Write-Host $text
          if ($text -match 'host console 3') { throw 'the widget page has a script error' }
          if ($text -notmatch '"cards":[1-9]') { throw 'no widgets were drawn' }

      - name: Upload for download
        uses: actions/upload-artifact@v4
        with:
          name: Glass-Widgets-Windows
          path: dist/*.exe
          if-no-files-found: error

      # 只有 main 才發佈；latest.yml 和 .blockmap 是自動更新要用的
      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Glass Widgets ${{ steps.version.outputs.label }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/Glass-Widgets-Setup-*.exe
            dist/Glass-Widgets-Setup-*.exe.blockmap
            dist/Glass-Widgets-Portable-*.exe
            dist/latest.yml
