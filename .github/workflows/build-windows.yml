# 在 GitHub 的 Windows 電腦上把程式打包成 .exe
# 每次推上去都會打包一次；在「Actions」頁面最新一次執行的「Artifacts」可以下載。
# 推一個 v 開頭的標籤（例如 v1.0.0）時，還會建立一個 Release，安裝檔放在 Releases 頁面。
name: Build Windows app

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build installer and portable exe
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Upload for download
        uses: actions/upload-artifact@v4
        with:
          name: Glass-Widgets-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
