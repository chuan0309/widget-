<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Glass Widget Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <!-- 手機外框 -->
    <div class="phone" id="phone">
      <div class="screen" id="screen">
        <!-- 動態桌布 -->
        <div class="wallpaper" id="wallpaper">
          <span class="blob b1"></span><span class="blob b2"></span>
          <span class="blob b3"></span><span class="blob b4"></span>
        </div>

        <!-- 狀態列 -->
        <header class="statusbar">
          <span class="sb-time" id="sbTime">9:41</span>
          <div class="island" id="island">
            <div class="island-content">
              <svg class="island-icon" viewBox="0 0 24 24"><path d="M7 7l10 10-5 5V2l5 5L7 17" /></svg>
              <span class="island-text" id="islandText">已連線</span>
              <span class="island-batt" id="islandBatt">85%</span>
            </div>
          </div>
          <div class="sb-right">
            <svg class="sb-bt" id="sbBt" viewBox="0 0 24 24"><path d="M7 7l10 10-5 5V2l5 5L7 17" /></svg>
            <svg viewBox="0 0 24 24" class="sb-wifi"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0M12 19.5h.01" /></svg>
            <div class="sb-batt"><i style="width:80%"></i></div>
          </div>
        </header>

        <!-- 桌面 -->
        <section class="home">
          <div class="grid">
            <!-- 時鐘 widget -->
            <div class="widget glass w-2x2 clock-widget">
              <div class="analog" id="analog">
                <i class="hand h" id="hHand"></i>
                <i class="hand m" id="mHand"></i>
                <i class="hand s" id="sHand"></i>
                <i class="pin"></i>
              </div>
              <div class="clock-meta">
                <span id="dateWeek">星期四</span>
                <b id="dateDay">26</b>
              </div>
            </div>

            <!-- 天氣 widget -->
            <div class="widget glass w-2x2 weather-widget">
              <div class="wt-city">台北市 <svg viewBox="0 0 24 24"><path d="M12 2l3 9H9z" transform="rotate(45 12 12)"/></svg></div>
              <div class="wt-temp">22°</div>
              <div class="wt-icon">
                <span class="sun"></span><span class="cloud"></span>
              </div>
              <div class="wt-desc">晴時多雲<br><small>高 25° 低 18°</small></div>
            </div>

            <!-- 電量 widget（4x2）-->
            <div class="widget glass w-4x2 battery-widget" id="battWidget">
              <div class="ring-item" data-dev="phone">
                <div class="ring" style="--p:80"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2.5"/></svg></div>
                <span>80%</span>
              </div>
              <div class="ring-item empty" data-dev="left">
                <div class="ring" style="--p:0"><svg viewBox="0 0 24 24"><path d="M10 4a4 4 0 0 1 4 4v3a2 2 0 0 1-2 2v7"/></svg></div>
                <span>—</span>
              </div>
              <div class="ring-item empty" data-dev="right">
                <div class="ring" style="--p:0"><svg viewBox="0 0 24 24"><path d="M14 4a4 4 0 0 0-4 4v3a2 2 0 0 0 2 2v7"/></svg></div>
                <span>—</span>
              </div>
              <div class="ring-item empty" data-dev="case">
                <div class="ring" style="--p:0"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="11" rx="4"/><path d="M4 11h16"/></svg></div>
                <span>—</span>
              </div>
            </div>

            <!-- App icons -->
            <button class="app" data-app="bt"><span class="icon glass ic-bt"><svg viewBox="0 0 24 24"><path d="M7 7l10 10-5 5V2l5 5L7 17" /></svg></span><label>藍牙</label></button>
            <button class="app"><span class="icon glass ic-music"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></span><label>音樂</label></button>
            <button class="app"><span class="icon glass ic-photo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></svg></span><label>照片</label></button>
            <button class="app" data-app="wall"><span class="icon glass ic-set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></span><label>換桌布</label></button>

            <!-- 音樂 widget（4x2）-->
            <div class="widget glass w-4x2 music-widget">
              <div class="cover"></div>
              <div class="mu-info">
                <b>Midnight Glass</b>
                <span>Lo-Fi Collective</span>
                <div class="mu-bar"><i id="muProg"></i></div>
              </div>
              <button class="mu-play" id="muPlay" aria-label="播放">
                <svg viewBox="0 0 24 24" id="muIcon"><path d="M8 5v14l11-7z"/></svg>
              </button>
            </div>
          </div>

          <div class="dots"><i class="on"></i><i></i><i></i></div>

          <!-- Dock -->
          <nav class="dock glass">
            <button class="app"><span class="icon ic-phone"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></span></button>
            <button class="app"><span class="icon ic-msg"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></span></button>
            <button class="app"><span class="icon ic-web"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></span></button>
            <button class="app"><span class="icon ic-cam"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/></svg></span></button>
          </nav>
        </section>

        <!-- 藍牙配對彈出視窗 -->
        <div class="sheet-backdrop" id="backdrop"></div>
        <div class="bt-sheet glass" id="sheet" role="dialog" aria-label="藍牙配對">
          <button class="sheet-close" id="sheetClose" aria-label="關閉">✕</button>
          <h2 id="sheetTitle">Aero Buds Pro</h2>
          <p class="sheet-sub" id="sheetSub">偵測到新的藍牙耳機</p>

          <div class="buds-art" id="budsArt">
            <div class="case-shape"><div class="lid"></div><i class="led"></i></div>
            <div class="bud bl"></div>
            <div class="bud br"></div>
          </div>

          <div class="sheet-batt" id="sheetBatt">
            <div><span class="mini-ring" style="--p:85"></span>左 85%</div>
            <div><span class="mini-ring" style="--p:90"></span>右 90%</div>
            <div><span class="mini-ring" style="--p:62"></span>盒 62%</div>
          </div>

          <button class="sheet-btn" id="connectBtn">
            <span class="btn-label">連線</span>
            <span class="spinner"></span>
          </button>
        </div>

        <div class="home-indicator"></div>
      </div>
    </div>

    <!-- 旁邊的控制面板 -->
    <aside class="panel">
      <h1>Glass Widget Demo</h1>
      <p>點下面的按鈕，或點桌面上的「藍牙」App，就會跳出配對視窗。</p>
      <button class="panel-btn" id="triggerBtn">模擬耳機靠近</button>
      <button class="panel-btn ghost" id="resetBtn">斷開連線</button>
      <button class="panel-btn ghost" id="wallBtn">換桌布</button>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
